tasks.register('allGameTests') {
  group = 'verification'
  description = 'Runs both Fabric and Forge game tests.'
  dependsOn ':Fabric:runGameTest', ':Forge:runGameTestServer'
}

tasks.register('fullCheck') {
  group = 'verification'
  description = 'Runs the standard checks and Fabric and Forge game tests.'
  dependsOn ':Common:check', ':Fabric:check', ':Forge:check', 'allGameTests'
}

tasks.register('publishModrinth') {
  group = 'publishing'
  description = 'Publishes Forge and Fabric to Modrinth.'
  dependsOn ':Forge:modrinth', ':Fabric:modrinth'
  mustRunAfter 'fullCheck'
}

tasks.register('publishDelay') {
  description = 'Pauses between Modrinth and CurseForge uploads so logs do not interfere.'
  mustRunAfter 'publishModrinth'
  doLast {
    println 'Waiting 5 seconds before CurseForge upload...'
    sleep(5000)
  }
}

tasks.register('publishCurseForge') {
  group = 'publishing'
  description = 'Publishes Forge and Fabric to CurseForge.'
  dependsOn ':Forge:curseforge', ':Fabric:curseforge'
  mustRunAfter 'publishDelay'
}

tasks.register('publishMods') {
  group = 'publishing'
  description = 'Builds, runs full checks, then publishes to Modrinth and (after a 5s pause) CurseForge.'
  dependsOn 'fullCheck', 'publishModrinth', 'publishDelay', 'publishCurseForge'
}

subprojects {

  apply plugin: 'java'

  java.toolchain.languageVersion = JavaLanguageVersion.of(17)
  java.withSourcesJar()
  java.withJavadocJar()

  repositories {
    mavenCentral()
    maven {
      url "https://www.cursemaven.com"
      content {
        includeGroup "curse.maven"
      }
    }
  }

  tasks.register('wrapper', Wrapper) {
    gradleVersion = '8.14.5'
    distributionType = Wrapper.DistributionType.BIN
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
  }

  tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
  }

  tasks.withType(Javadoc).configureEach {
    enabled = false
  }

  tasks.register("prepareKotlinBuildScriptModel") {}
}
