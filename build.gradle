import java.util.zip.ZipFile

buildscript {
  // The toolkit is only published to Maven Local, so its client test plugin stays optional and a
  // machine without it still builds and runs the game tests.
  String toolkitPluginModule = "client_runtime_interface_toolkit-gradle-plugin-${minecraft_version}"
  String toolkitPluginVersion = '2.1.0'
  File toolkitPluginDirectory = new File(
      System.getProperty('maven.repo.local', "${System.getProperty('user.home')}/.m2/repository"),
      "de/markusbordihn/clientruntimeinterfacetoolkit/${toolkitPluginModule}/${toolkitPluginVersion}")
  ext.clientRuntimeTestPluginAvailable = toolkitPluginDirectory.isDirectory()
  repositories {
    mavenLocal {
      content {
        includeGroup 'de.markusbordihn.clientruntimeinterfacetoolkit'
      }
    }
  }
  dependencies {
    if (clientRuntimeTestPluginAvailable) {
      classpath "de.markusbordihn.clientruntimeinterfacetoolkit:${toolkitPluginModule}:${toolkitPluginVersion}"
    }
  }
}

plugins {
  id 'idea'
  id "org.jetbrains.gradle.plugin.idea-ext" version "1.3"
}

def ghostRefScript = file(findProperty('ghostRefIndex') ?: '')
if (ghostRefScript.exists()) apply from: ghostRefScript

apply from: 'gradle/tasks/generateMobCaptureCardItem.gradle'

tasks.register('allGameTests') {
  group = 'verification'
  description = 'Runs Fabric, Forge and NeoForge game tests.'
  dependsOn ':Fabric:runGameTest', ':Forge:runGameTestServer', ':NeoForge:runGameTestServer'
}

tasks.register('verifyProductionJars') {
  group = 'verification'
  description = 'Checks that release jars contain no game or client test code or resources.'
  dependsOn ':Common:jar', ':Fabric:jar', ':Forge:jar', ':NeoForge:jar'

  doLast {
    [project(':Common').tasks.named('jar'),
     project(':Fabric').tasks.named('jar'),
     project(':Forge').tasks.named('jar'),
     project(':NeoForge').tasks.named('jar')].each { archiveTask ->
      File archiveFile = archiveTask.get().archiveFile.get().asFile
      new ZipFile(archiveFile).withCloseable { archive ->
        archive.entries().each { entry ->
          String entryName = entry.name.toLowerCase(Locale.ROOT)
          if (entryName.contains('/gametest/') || entryName.contains('/clienttest/')
              || entryName.contains('/test_instance/') || entryName.contains('/test_environment/')
              || entryName.contains('/gametest.') || entryName.startsWith('org/junit/')
              || entryName.startsWith('org/mockito/')
              || entryName.startsWith('de/markusbordihn/clientruntimeinterfacetoolkit/')) {
            throw new GradleException("Test content in ${archiveFile.name}: ${entry.name}")
          }
          if (entry.name == 'fabric.mod.json') {
            archive.getInputStream(entry).withCloseable { metadata ->
              if (metadata.getText('UTF-8').contains('"fabric-gametest"')) {
                throw new GradleException("Game test entrypoints in ${archiveFile.name}")
              }
            }
          }
        }
      }
      logger.lifecycle("Verified production jar: ${archiveFile.name}")
    }
  }
}

tasks.register('fullCheck') {
  group = 'verification'
  description = 'Runs the standard checks and Fabric, Forge and NeoForge game tests.'
  dependsOn ':Common:check', ':Fabric:check', ':Forge:check', ':NeoForge:check', 'allGameTests', 'verifyProductionJars'
}

tasks.register('publishModrinth') {
  group = 'publishing'
  description = 'Publishes Forge, NeoForge and Fabric to Modrinth.'
  dependsOn ':Forge:modrinth', ':NeoForge:modrinth', ':Fabric:modrinth'
  mustRunAfter 'fullCheck'
}

tasks.register('publishDelay') {
  description = 'Pauses between Modrinth and CurseForge uploads so logs do not interfere.'
  mustRunAfter 'publishModrinth'
  doLast {
    println 'Waiting 5 seconds before CurseForge upload...'
    sleep(5000)
  }
}

tasks.register('publishCurseForge') {
  group = 'publishing'
  description = 'Publishes Forge, NeoForge and Fabric to CurseForge.'
  dependsOn ':Forge:curseforge', ':NeoForge:curseforge', ':Fabric:curseforge'
  mustRunAfter 'publishDelay'
}

tasks.register('publishMods') {
  group = 'publishing'
  description = 'Builds, runs full checks, then publishes to Modrinth and (after a 5s pause) CurseForge.'
  dependsOn 'fullCheck', 'publishModrinth', 'publishDelay', 'publishCurseForge'
}

subprojects {

  apply plugin: 'java'

  tasks.named('processResources') {
    dependsOn rootProject.tasks.named('generateMobCaptureCardModel')
  }

  java.toolchain.languageVersion = JavaLanguageVersion.of(25)
  java.withSourcesJar()
  java.withJavadocJar()

  repositories {
    mavenCentral()
    maven {
      url "https://www.cursemaven.com"
      content {
        includeGroup "curse.maven"
      }
    }
  }

  dependencies {
    configurations.configureEach {
      resolutionStrategy.force 'org.ow2.asm:asm:9.8'
      resolutionStrategy.force 'org.ow2.asm:asm-commons:9.8'
    }
  }

  tasks.register('wrapper', Wrapper) {
    gradleVersion = '9.8.2'
    distributionType = Wrapper.DistributionType.BIN
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
  }

  tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
  }

  tasks.withType(Javadoc).configureEach {
    enabled = false
  }

  tasks.register("prepareKotlinBuildScriptModel") {}

  idea {
    module {
      downloadSources = true
      downloadJavadoc = true
    }
  }
}

if (clientRuntimeTestPluginAvailable) {
  apply plugin: 'de.markusbordihn.clientruntimeinterfacetoolkit.client-test'
}
