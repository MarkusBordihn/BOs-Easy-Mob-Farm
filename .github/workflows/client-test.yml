name: Run client tests

on: [ workflow_dispatch ]

permissions:
  contents: read

jobs:
  client-test:

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Client Runtime Interface Toolkit
        uses: actions/checkout@v4
        with:
          repository: MarkusBordihn/BOs-Client-Runtime-Interface-Toolkit
          ref: '1.20.1'
          path: client-runtime-interface-toolkit

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa libxrandr2 libxinerama1 \
            libxcursor1 libxi6 libxxf86vm1

      - name: Build Client Runtime Interface Toolkit and Publish to Maven Local
        working-directory: client-runtime-interface-toolkit
        run: |
          chmod +x gradlew
          ./gradlew -p core --console=plain build -x test --no-daemon

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Client Tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x720x24"
          ./gradlew allClientTests --console=plain --no-daemon

      - name: Upload client test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-logs
          path: .client_test/
          if-no-files-found: ignore
